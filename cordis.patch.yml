# dsh-allow bundle 层:一个宿主插件行(浏览器半由 package.json 的 dsh.client 声明注入)。
# 安装: dsh plugin --profile web add link:<本目录>
# 可选配置:
#   - id: dsh-allow
#     config:
#       rulesFile: /path/to/rules.json        # 默认 $DSH_HOME/dsh-allow.json
#       auditFile: /path/to/audit.ndjson      # 默认 $DSH_HOME/dsh-allow-audit.ndjson
#       audit: true                           # 关掉审计写 false
#       defaultDecision: allow                # 或 prompt: 全量把关
- insert:
    - id: dsh-allow
      name: dsh-allow
